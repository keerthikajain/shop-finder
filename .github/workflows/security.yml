name: Security checks
on:
  push:
    branches: [main, "security/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Git history without printing credentials
        run: python scripts/security_scan.py
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check production npm dependencies for high-severity advisories
        run: npm audit --prefix frontend --audit-level=high
      - name: Install Python vulnerability auditor
        run: python -m pip install pip-audit
      - name: Audit pinned backend packages
        run: python -m pip_audit -r backend/requirements-dev.txt
