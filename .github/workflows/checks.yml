name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: npm ci --prefix frontend
      - run: python -m pytest backend/tests -q
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production Docker image
        run: docker build --tag shop-finder:ci .
      - name: Verify clean production startup
        run: |
          docker run --rm -d --name shop-finder-ci -e SHOP_FINDER_SEED_DEMO=false -e GNANI_ENABLED=false -p 127.0.0.1:18080:8080 shop-finder:ci
          trap 'docker logs shop-finder-ci; docker stop shop-finder-ci' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/api/health > /tmp/shopfinder-health.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          with open('/tmp/shopfinder-health.json',encoding='utf-8') as file:
              result=json.load(file)
          assert result['status']=='ok',result
          assert result['voice_status']=='disabled',result
          print('Production container started and health endpoint is responsive')
          from urllib.request import urlopen
          from urllib.error import HTTPError
          base='http://127.0.0.1:18080'
          for sensitive_path in ('/.env','/.git/config','/backend/app/accounts.py',
                                 '/data/shop_finder.sqlite3','/openapi.json','/docs'):
              try:
                  with urlopen(base+sensitive_path,timeout=5) as response:
                      status=response.status
              except HTTPError as error:
                  status=error.code
              assert status==404,(sensitive_path,status)
          with urlopen(base+'/api/health',timeout=5) as response:
              assert "script-src 'self'" in response.headers.get('Content-Security-Policy','')
              assert response.headers.get('X-Frame-Options')=='DENY'
              assert response.headers.get('Cache-Control')=='no-store'
          print('Sensitive files are not served; security headers are present.')
          PY

      - name: Verify isolated judge signup in production image
        run: |
          docker run --rm -d --name shop-finder-reviewer-ci \
            -e SHOP_FINDER_CHALLENGE_SIGNUP=true \
            -e SHOP_FINDER_CHALLENGE_DATA_DIR=/data/reviewer_workspaces \
            -e SHOP_FINDER_DB=/data/registry.sqlite3 \
            -e GNANI_ENABLED=false \
            -p 127.0.0.1:18081:8080 shop-finder:ci
          trap 'docker logs shop-finder-reviewer-ci; docker stop shop-finder-reviewer-ci' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18081/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --silent --show-error --fail \
            --cookie-jar /tmp/reviewer-one.cookies \
            -H 'Content-Type: application/json' -H 'X-Shop-Request: 1' \
            -d '{"username":"judge_one","password":"strong-judge-password-111","language":"en"}' \
            http://127.0.0.1:18081/api/challenge/signup > /tmp/reviewer-one.json
          curl --silent --show-error --fail \
            --cookie-jar /tmp/reviewer-two.cookies \
            -H 'Content-Type: application/json' -H 'X-Shop-Request: 1' \
            -d '{"username":"judge_two","password":"strong-judge-password-222","language":"hi"}' \
            http://127.0.0.1:18081/api/challenge/signup > /tmp/reviewer-two.json
          curl --silent --show-error --fail --cookie /tmp/reviewer-one.cookies \
            http://127.0.0.1:18081/api/warehouse/items?collection=all > /tmp/reviewer-items.json
          python - <<'PY'
          import json
          from pathlib import Path
          one=json.loads(Path('/tmp/reviewer-one.json').read_text())
          two=json.loads(Path('/tmp/reviewer-two.json').read_text())
          items=json.loads(Path('/tmp/reviewer-items.json').read_text())
          assert one['role']==two['role']=='owner'
          assert one['username']=='judge_one' and two['username']=='judge_two'
          assert len(items)>=10, 'Expected saved example items in the reviewer workspace'
          def workspace_cookie(path):
              return next(line.split('\t')[-1] for line in Path(path).read_text().splitlines()
                          if '\tshop_workspace\t' in line)
          assert workspace_cookie('/tmp/reviewer-one.cookies') != workspace_cookie('/tmp/reviewer-two.cookies')
          print('Real judge signup, saved catalogue and isolated workspace cookies passed.')
          PY
