name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: npm ci --prefix frontend
      - run: python -m pytest backend/tests -q
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production Docker image
        run: docker build --tag shop-finder:ci .
      - name: Verify clean production startup
        run: |
          docker run --rm -d --name shop-finder-ci -e SHOP_FINDER_SEED_DEMO=false -e GNANI_ENABLED=false -p 127.0.0.1:18080:8080 shop-finder:ci
          trap 'docker logs shop-finder-ci; docker stop shop-finder-ci' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/api/health > /tmp/shopfinder-health.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          with open('/tmp/shopfinder-health.json',encoding='utf-8') as file:
              result=json.load(file)
          assert result['status']=='ok',result
          assert result['voice_status']=='disabled',result
          print('Production container started and health endpoint is responsive')
          from urllib.request import urlopen
          from urllib.error import HTTPError
          base='http://127.0.0.1:18080'
          for sensitive_path in ('/.env','/.git/config','/backend/app/accounts.py',
                                 '/data/shop_finder.sqlite3','/openapi.json','/docs'):
              try:
                  with urlopen(base+sensitive_path,timeout=5) as response:
                      status=response.status
              except HTTPError as error:
                  status=error.code
              assert status==404,(sensitive_path,status)
          with urlopen(base+'/api/health',timeout=5) as response:
              assert "script-src 'self'" in response.headers.get('Content-Security-Policy','')
              assert response.headers.get('X-Frame-Options')=='DENY'
              assert response.headers.get('Cache-Control')=='no-store'
          print('Sensitive files are not served; security headers are present.')
          PY
